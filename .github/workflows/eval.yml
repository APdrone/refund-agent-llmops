name: Agentic AI Testing Pyramid CI/CD Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - 'agent/**'
      - 'evaluations/**'
      - 'tests/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'agent/**'
      - 'evaluations/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Pyramid layer to evaluate'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '1'
          - '2'
          - '3'
          - '4'
      live_mode:
        description: 'Execute live LLM calls (otherwise safe dry-run)'
        required: true
        default: false
        type: boolean

jobs:
  test-pyramid:
    name: Run Agentic Testing Pyramid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen || uv pip install -r pyproject.toml

      - name: Initialize and Seed Database
        run: |
          python agent/db.py

      # TIER 1: Free Deterministic Gatekeeper (Fails fast before calling LLMs)
      - name: Layer 1 - Deterministic Pytest Gate ($0 Cost)
        run: |
          pytest -v tests/

      # TIER 2 & 3: Evaluation Suite Verification (Dry-Run by default)
      - name: Run Testing Pyramid Orchestrator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: "gpt-4o-mini"
          EVAL_MODEL: "gpt-4o-mini"
        run: |
          if [ "${{ github.event.inputs.live_mode }}" = "true" ] && [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            python evaluations/pyramid_runner.py --layer ${{ github.event.inputs.layer || 'all' }} --live
          else
            python evaluations/pyramid_runner.py --layer ${{ github.event.inputs.layer || 'all' }}
          fi

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            *.md
            *.json
